name: Release images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare tracked source and test-only wheels
        run: python3 ops/build_context.py
      - name: Test release policy and failure recovery
        run: |
          python3 ops/test_release.py
          python3 ops/test_publish.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify public registry destinations using source-free markers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/publish.py --prepare-registry
      - name: Build backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .release/backend
          file: ops/backend.Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ghcr.io/alexupetrescu/aveletter-production-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/alexupetrescu/aveletter.ro
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aveletter-backend
          cache-to: type=gha,mode=max,scope=aveletter-backend
      - name: Test backend on disposable PostgreSQL
        run: python3 ops/ci.py backend ghcr.io/alexupetrescu/aveletter-production-backend:sha-${{ github.sha }}
      - name: Build frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .release/frontend
          file: ops/frontend.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ghcr.io/alexupetrescu/aveletter-production-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/alexupetrescu/aveletter.ro
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aveletter-frontend
          cache-to: type=gha,mode=max,scope=aveletter-frontend
      - name: Test frontend HTTP, JavaScript and native image library
        run: python3 ops/ci.py frontend ghcr.io/alexupetrescu/aveletter-production-frontend:sha-${{ github.sha }}
      - name: Publish public images and release manifest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/publish.py
      - name: Save deployment manifest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-aveletter
          path: .release/release.json
          if-no-files-found: error
          retention-days: 90
